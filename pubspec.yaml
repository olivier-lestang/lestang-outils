name: lestang_outils
description: Lestang Outils, multiplateformes, conjugaisons et cartes au quotidien. MIT.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  pdf: ^3.10.0
  printing: ^5.13.0
  image: ^4.2.0
  file_selector: ^1.0.3
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lestang_outils.db
